<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Control — Permission Card (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── Tokens lifted verbatim from resources/css/app.css ───────────────── */
  :root[data-theme="light"] {
    --brand: #2563eb;
    --content: #f6f8fb;
    --foreground: hsl(222 30% 12%);
    --card: hsl(0 0% 100%);
    --muted: hsl(210 20% 92%);
    --muted-foreground: hsl(215 16% 47%);
    --border: hsl(214 20% 90%);
    --rail: hsl(214 22% 88%);
    --shadow: 0 1px 2px hsl(222 30% 12% / .04), 0 10px 30px -16px hsl(222 30% 12% / .12);
  }
  :root[data-theme="dark"] {
    --brand: #3b82f6;
    --content: hsl(222 26% 7%);
    --foreground: hsl(210 20% 92%);
    --card: hsl(222 24% 11%);
    --muted: hsl(217 20% 20%);
    --muted-foreground: hsl(215 16% 60%);
    --border: hsl(217 19% 20%);
    --rail: hsl(217 19% 26%);
    --shadow: 0 1px 2px hsl(0 0% 0% / .3), 0 14px 34px -18px hsl(0 0% 0% / .65);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--content);
    color: var(--foreground);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 34px 20px 80px;
    min-height: 100vh;
  }

  .wrap { max-width: 600px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .topbar h1 { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-foreground); margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--card); }
  .seg button { font: inherit; font-size: 11px; padding: 4px 10px; border: 0; background: transparent; color: var(--muted-foreground); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  /* ── Card (compact, like the app's module cards) ─────────────────────── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; }
  .card-head .glyph { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 11%, transparent); color: var(--brand); }
  .card-head .title { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .card-head .tally { margin-left: auto; font-size: 10.5px; font-family: "IBM Plex Mono", monospace; font-weight: 500; color: var(--muted-foreground); }
  .card-head .tally b { color: var(--brand); }

  /* ── Master row ──────────────────────────────────────────────────────── */
  .master { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--brand) 3.5%, transparent); }
  .master .meta { display: flex; flex-direction: column; line-height: 1.3; }
  .master .meta .lbl { font-weight: 600; font-size: 12.5px; }
  .master .meta .hint { font-size: 10px; color: var(--muted-foreground); margin-top: 1px; }
  .master .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .sb { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted-foreground); }
  .sb .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--muted-foreground); opacity: .5; }
  .sb.on { color: var(--brand); }
  .sb.on .dot { background: var(--brand); opacity: 1; box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--brand) 16%, transparent); }

  /* ── Groups ──────────────────────────────────────────────────────────── */
  .panel { transition: opacity .2s ease; padding: 3px 0; columns: 2; column-gap: 8px; }
  .panel.disabled { opacity: .4; }
  .group { padding: 1px 14px; break-inside: avoid; }

  .row { display: flex; align-items: center; gap: 8px; min-height: 29px; }
  .row .name { font-size: 12.5px; color: var(--foreground); }
  .row.parent .name { font-weight: 600; }
  .row .right { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .tag { font-size: 9px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); padding: 2px 6px; border-radius: 5px; }

  /* child rows — quiet, hung off a thin rail */
  .children { position: relative; margin-left: 4px; padding-left: 16px; }
  .children::before { content: ""; position: absolute; left: 3px; top: -2px; bottom: 15px; width: 1.5px; background: var(--rail); }
  .children .row .name { color: var(--muted-foreground); font-size: 12px; }
  .children .row::before { content: ""; position: absolute; left: -13px; top: 50%; width: 10px; height: 1.5px; background: var(--rail); }
  .children .row { position: relative; }

  /* ── Toggle (matches the app's h-5 w-9 switch) ───────────────────────── */
  .sw { position: relative; width: 34px; height: 19px; border-radius: 999px; border: 0; padding: 0; background: var(--muted); cursor: pointer; flex: none; transition: background .18s ease; }
  .sw .knob { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 999px; background: #fff; display: grid; place-items: center; transition: left .18s cubic-bezier(.4,0,.2,1); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .sw .knob svg { width: 9px; height: 9px; color: var(--brand); opacity: 0; transition: opacity .15s ease; }
  .sw[aria-checked="true"] { background: var(--brand); }
  .sw[aria-checked="true"] .knob { left: 17px; }
  .sw[aria-checked="true"] .knob svg { opacity: 1; }
  .sw[data-locked="true"] { cursor: not-allowed; opacity: .45; }
  .sw .lock { display: none; }
  .sw[data-locked="true"] .lock { display: grid; place-items: center; position: absolute; inset: 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 4px 0; font-size: 10.5px; color: var(--muted-foreground); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 20px; height: 12px; border-radius: 999px; }
  .swatch.on { background: var(--brand); }
  .swatch.off { background: var(--muted); }
  .swatch.lock { background: var(--muted); opacity: .45; }
  .note { max-width: 600px; margin: 12px auto 0; font-size: 11px; color: var(--muted-foreground); line-height: 1.5; }

  .master, .group { animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Permission · Stock</h1>
      <div class="seg" role="group" aria-label="theme">
        <button data-theme-btn="light" aria-pressed="true">Light</button>
        <button data-theme-btn="dark" aria-pressed="false">Dark</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="glyph" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35"/><path d="M2 8.35 3.6 4.4A2 2 0 0 1 5.46 3h13.08a2 2 0 0 1 1.86 1.4L22 8.35"/><path d="M2 8.35h20"/></svg>
        </span>
        <span class="title">Stock</span>
        <span class="tally"><b id="tallyOn">0</b> / <span id="tallyTotal">0</span></span>
      </div>

      <div id="cardBody"><!-- rendered by JS --></div>
    </div>

    <div class="legend">
      <span><i class="swatch on"></i> On</span>
      <span><i class="swatch off"></i> Off</span>
      <span><i class="swatch lock"></i> Locked</span>
    </div>
    <p class="note">
      <b>Stock Module</b> is the master — it drives the sidebar icon and gates everything below.
      Each parent unlocks the items beneath it; turning a parent off cascades its children off and locks them.
    </p>
  </div>

<script>
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const LOCK  = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted-foreground)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  const MASTER = { key: 'stock.module', label: 'Stock Module' };
  const GROUPS = [
    { key: 'stock.view_dashboard', label: 'Dashboard',  children: [] },
    { key: 'stock.view',           label: 'Stock item', children: [
        { key: 'stock.manage_items', label: 'Manage SKU' },
        { key: 'stock.receive',      label: 'Receive' },
        { key: 'stock.return',       label: 'Return' },
        { key: 'stock.transfer',     label: 'Transfer' },
    ]},
    { key: 'stock.view_request', label: 'Request', children: [
        { key: 'stock.request', label: 'New Request' },
        { key: 'stock.approve', label: 'Approve Request' },
        { key: 'stock.fulfill', label: 'Issue / Fulfill' },
    ]},
    { key: 'stock.view_count', label: 'Counting', children: [
        { key: 'stock.count', label: 'Counting' },
    ]},
    { key: 'stock.view_events', label: 'Event', children: [
        { key: 'stock.events', label: 'Events' },
    ]},
  ];

  // Seed state — a realistic "warehouse operator" role.
  const on = new Set(['stock.module','stock.view','stock.manage_items','stock.receive','stock.transfer','stock.view_request','stock.request','stock.view_dashboard']);
  const allKeys = [MASTER.key, ...GROUPS.flatMap(g => [g.key, ...g.children.map(c => c.key)])];

  function toggle(key) {
    if (on.has(key)) {
      on.delete(key);
      if (key === MASTER.key) allKeys.forEach(k => on.delete(k));
      const g = GROUPS.find(g => g.key === key);
      if (g) g.children.forEach(c => on.delete(c.key));
    } else {
      on.add(key);
      const parent = GROUPS.find(g => g.children.some(c => c.key === key));
      if (parent) { on.add(parent.key); on.add(MASTER.key); }
      if (GROUPS.some(g => g.key === key)) on.add(MASTER.key);
    }
    render();
  }

  function swEl(key, locked) {
    const checked = on.has(key) && !locked;
    return `<button class="sw" role="switch" aria-checked="${checked}" data-locked="${locked}" ${locked ? '' : `onclick="toggle('${key}')"`}>
      <span class="knob">${CHECK}</span>${locked ? `<span class="lock">${LOCK}</span>` : ''}
    </button>`;
  }

  function rowEl(label, key, locked, parent) {
    return `<div class="row ${parent ? 'parent' : ''}"><span class="name">${label}</span><span class="right">${parent ? '<span class="tag">View</span>' : ''}${swEl(key, locked)}</span></div>`;
  }

  function render() {
    const masterOn = on.has(MASTER.key);
    let html = `<div class="master">
      <span class="meta"><span class="lbl">${MASTER.label}</span><span class="hint">Master · gates the module and the sidebar icon</span></span>
      <span class="right">
        ${swEl(MASTER.key, false)}
      </span>
    </div>`;

    html += `<div class="panel ${masterOn ? '' : 'disabled'}">`;
    for (const g of GROUPS) {
      const viewOn = on.has(g.key) && masterOn;
      html += `<div class="group">`;
      html += rowEl(g.label, g.key, !masterOn, true);
      if (g.children.length) {
        html += `<div class="children">`;
        for (const c of g.children) html += rowEl(c.label, c.key, !viewOn, false);
        html += `</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
    document.getElementById('cardBody').innerHTML = html;

    let active = 0;
    if (masterOn) {
      active++;
      for (const g of GROUPS) if (on.has(g.key)) { active++; for (const c of g.children) if (on.has(c.key)) active++; }
    }
    document.getElementById('tallyOn').textContent = active;
    document.getElementById('tallyTotal').textContent = allKeys.length;
  }

  document.querySelectorAll('[data-theme-btn]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.documentElement.setAttribute('data-theme', btn.getAttribute('data-theme-btn'));
      document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', b === btn));
    });
  });

  render();
</script>
</body>
</html>
