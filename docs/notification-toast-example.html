<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notification Toast — IT Service Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
    :root {
        --bg: #eef1f6;
        --surface: #0f1729;          /* dark toast body */
        --surface-2: #18233c;
        --line: rgba(255, 255, 255, .08);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --brand: #3b82f6;
        /* per-type accents */
        --c-stock: #f59e0b;
        --c-contract: #ef4444;
        --c-request: #3b82f6;
        --c-success: #10b981;
        --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        color: #0f172a;
        background:
            radial-gradient(60% 50% at 80% 0%, rgba(59, 130, 246, .10), transparent 70%),
            linear-gradient(rgba(15, 23, 42, .035) 1px, transparent 1px) 0 0 / 26px 26px,
            linear-gradient(90deg, rgba(15, 23, 42, .035) 1px, transparent 1px) 0 0 / 26px 26px,
            var(--bg);
        display: grid;
        place-items: center;
        padding: 40px 20px;
    }

    /* ── Demo control panel ─────────────────────────────────── */
    .panel {
        width: min(440px, 100%);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 26px;
        box-shadow: 0 20px 50px -24px rgba(15, 23, 42, .25);
    }
    .panel h1 {
        margin: 0 0 4px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -.01em;
    }
    .panel p {
        margin: 0 0 20px;
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
    }
    .btns { display: grid; gap: 9px; }
    .btns button {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        background: #fff;
        font: inherit;
        font-size: 13.5px;
        font-weight: 500;
        color: #0f172a;
        cursor: pointer;
        transition: transform .12s ease, border-color .15s ease, background .15s ease;
    }
    .btns button:hover { background: #f8fafc; border-color: #cbd5e1; transform: translateY(-1px); }
    .btns button:active { transform: translateY(0); }
    .btns .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

    /* ── Toast stack (bottom-right) ─────────────────────────── */
    .toast-stack {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 360px;
        max-width: calc(100vw - 32px);
        pointer-events: none;   /* clicks pass through gaps; toasts re-enable below */
    }

    .toast {
        pointer-events: auto;
        position: relative;
        display: flex;
        gap: 12px;
        padding: 14px 14px 14px 16px;
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 18px 40px -18px rgba(2, 6, 23, .65), 0 2px 6px rgba(2, 6, 23, .3);
        overflow: hidden;
        transform: translateX(120%);
        opacity: 0;
        animation: toast-in .42s cubic-bezier(.21, 1.02, .42, 1) forwards;
    }
    /* left accent bar coloured per type (set via --accent inline) */
    .toast::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--accent);
    }
    .toast.leaving {
        animation: toast-out .3s ease forwards;
    }

    .toast .chip {
        flex: none;
        width: 38px; height: 38px;
        border-radius: 10px;
        display: grid; place-items: center;
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--accent);
    }
    .toast .chip svg { width: 20px; height: 20px; }

    .toast .body { min-width: 0; flex: 1; }
    .toast .title {
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -.005em;
    }
    .toast .msg {
        margin-top: 2px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--muted);
    }
    .toast .meta {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10.5px;
        color: #64748b;
    }
    .toast .meta .code {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        padding: 1px 6px;
        border-radius: 5px;
        font-weight: 600;
    }

    .toast .close {
        flex: none;
        align-self: flex-start;
        width: 24px; height: 24px;
        display: grid; place-items: center;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #64748b;
        cursor: pointer;
        transition: background .15s, color .15s;
    }
    .toast .close:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
    .toast .close svg { width: 15px; height: 15px; }

    /* auto-dismiss progress bar */
    .toast .progress {
        position: absolute;
        left: 0; bottom: 0;
        height: 2.5px;
        width: 100%;
        transform-origin: left;
        background: var(--accent);
        opacity: .8;
        animation: progress var(--life, 6s) linear forwards;
    }
    /* pause countdown + bar while hovering the toast */
    .toast:hover .progress { animation-play-state: paused; }

    @keyframes toast-in {
        from { transform: translateX(120%); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes toast-out {
        from { transform: translateX(0); opacity: 1; max-height: 200px; margin-bottom: 0; }
        to   { transform: translateX(120%); opacity: 0; max-height: 0; margin-bottom: -12px; padding-top: 0; padding-bottom: 0; }
    }
    @keyframes progress {
        from { transform: scaleX(1); }
        to   { transform: scaleX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
        .toast { animation-duration: .01ms; }
        .toast .progress { display: none; }
    }
</style>
</head>
<body>
    <div class="panel">
        <h1>การแจ้งเตือนเด้ง (Toast)</h1>
        <p>ตัวอย่าง notification ที่เด้งมุมขวาล่างเมื่อมีรายการใหม่ — สไลด์เข้า, หายเองใน 6 วินาที (เลื่อนเมาส์ไปวางเพื่อหยุดนับ), กด × เพื่อปิด กดปุ่มด้านล่างเพื่อทดลอง</p>
        <div class="btns">
            <button onclick="fire('stock')"><span class="dot" style="background:var(--c-stock)"></span> สต็อกต่ำ / ใกล้หมด</button>
            <button onclick="fire('contract')"><span class="dot" style="background:var(--c-contract)"></span> สัญญาใกล้หมดอายุ</button>
            <button onclick="fire('request')"><span class="dot" style="background:var(--c-request)"></span> คำขอเบิกรออนุมัติ</button>
            <button onclick="fire('success')"><span class="dot" style="background:var(--c-success)"></span> รับเข้าสต็อกสำเร็จ</button>
        </div>
    </div>

    <div class="toast-stack" id="stack" aria-live="polite" aria-atomic="false"></div>

    <script>
        // Inline icon set (stroke-based, 24x24) keyed by notification type.
        const ICONS = {
            stock:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 3l9 6v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 21V12h6v9"/></svg>',
            contract: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="9"/></svg>',
            request:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="m9 14 2 2 4-4"/></svg>',
            success:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7 12 16l-4-4"/><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0" opacity=".35"/></svg>',
        };

        // Demo content per type — mirrors the kinds of events the bell already tracks.
        const PRESETS = {
            stock:    { accent: 'var(--c-stock)',    title: 'สต็อกต่ำกว่าขั้นต่ำ',     msg: 'APC Back-UPS BX1100C เหลือ 2 ชิ้น — ควรสั่งซื้อเพิ่ม', code: 'SK-UPS-001' },
            contract: { accent: 'var(--c-contract)', title: 'สัญญาใกล้หมดอายุ',        msg: 'สัญญากับ Acme Co. จะหมดอายุใน 7 วัน',              code: 'CT-2026-014' },
            request:  { accent: 'var(--c-request)',  title: 'คำขอเบิกรออนุมัติ',       msg: 'พิชชนก ขอเบิก RAM 8GB × 2 รออนุมัติ',                code: 'REQ-2026-031' },
            success:  { accent: 'var(--c-success)',  title: 'รับเข้าสต็อกสำเร็จ',       msg: 'รับเข้า Canon Toner 057 จำนวน 8 ชิ้น เข้าคลังกลาง', code: 'RCV-2026-020' },
        };

        const LIFE_MS = 6000;
        const stack = document.getElementById('stack');

        function fire(type) {
            const p = PRESETS[type];
            const el = document.createElement('div');
            el.className = 'toast';
            el.style.setProperty('--accent', p.accent);
            el.style.setProperty('--life', LIFE_MS + 'ms');
            el.innerHTML = `
                <span class="chip">${ICONS[type]}</span>
                <div class="body">
                    <div class="title">${p.title}</div>
                    <div class="msg">${p.msg}</div>
                    <div class="meta"><span class="code">${p.code}</span><span>เมื่อสักครู่</span></div>
                </div>
                <button class="close" aria-label="ปิด">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
                <span class="progress"></span>`;

            // Newest on top.
            stack.prepend(el);

            const close = () => dismiss(el);
            el.querySelector('.close').addEventListener('click', close);

            // Auto-dismiss, paused while hovered (so the CSS bar and the timer stay in sync).
            let remaining = LIFE_MS;
            let startedAt = Date.now();
            let timer = setTimeout(close, remaining);
            el.addEventListener('mouseenter', () => {
                clearTimeout(timer);
                remaining -= Date.now() - startedAt;
            });
            el.addEventListener('mouseleave', () => {
                startedAt = Date.now();
                timer = setTimeout(close, remaining);
            });
        }

        function dismiss(el) {
            if (el.classList.contains('leaving')) return;
            el.classList.add('leaving');
            el.addEventListener('animationend', () => el.remove(), { once: true });
        }

        // Pop one on load so the demo shows immediately.
        window.addEventListener('load', () => setTimeout(() => fire('stock'), 400));
    </script>
</body>
</html>
